[package]
name = "attn-lens"
version = "0.5.0"
edition = "2024"
description = "Capture part of the live screen, draw on it, talk, and send it to an attn agent session."
license = "MIT"
repository = "https://github.com/SolenesInc/attn-lens"
readme = "README.md"
keywords = ["screenshot", "annotation", "macos", "rune", "attn"]
categories = ["multimedia::images", "gui"]
publish = false

[dependencies]
rune = { git = "https://github.com/SolenesInc/rune.git", rev = "f80f6d03b6a5c6004798d7828345cb004047113b", features = ["native-file-dialog"] }
image = "0.25"
imageproc = "0.25"
tempfile = "3"
ab_glyph = "0.2"
async-channel = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gif = "0.14"
color_quant = "1"
hound = "3.5"

[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { version = "~30.0.1", default-features = false, features = ["std", "vulkan", "glsl"] }
pollster = "0.4"
bytemuck = "1"

[target.'cfg(target_os = "macos")'.dependencies]
global-hotkey = "0.7"
arboard = "3.6"
objc = "0.2"
objc2 = "0.6"
block = "0.1"
block2 = "0.6"
metal = "0.29"
# Hex's recorder core (MIT): stills through ScreenCaptureKit now, recordings later.
capture-core = { git = "https://github.com/anomalyco/hex", rev = "54d1ebfccfa981ad73c5a2fd833504a55e6676c9" }
security-framework = "3"
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "AVCaptureDevice", "AVMediaFormat"] }
objc2-avf-audio = { version = "0.3", default-features = false, features = ["std", "block2", "AVAudioBuffer", "AVAudioConverter", "AVAudioEngine", "AVAudioFormat", "AVAudioIONode", "AVAudioNode", "AVAudioTime", "AVAudioTypes"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "bitflags", "NSError", "NSNotification", "NSProcessInfo", "NSString"] }

[build-dependencies]
cc = "1"

[dev-dependencies]
resvg = { version = "=0.45.1", default-features = false }

[profile.release]
lto = "thin"
strip = true
